<!DOCTYPE html>
<html>
<head>
<title>FOX Mini App</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="logo">
        🦊
    </div>

    <h1>FOX</h1>

    <div class="balance">

        <div>
            🪙 FOX
            <br>
            <span id="foxBalance">0</span>
        </div>

        <div>
            💵 Dollar
            <br>
            $<span id="dollarBalance">0</span>
        </div>

    </div>


    <button class="coin-btn" onclick="tapFox()">
        FOX<br>
        Tap Here
    </button>


    <div class="menu">

        <button onclick="showPage('earn')">
            💰 Earn
        </button>

        <button onclick="showPage('missions')">
            🎯 Missions
        </button>

        <button onclick="showPage('rank')">
            🏆 Rank
        </button>

        <button onclick="showPage('profile')">
            👤 Profile
        </button>

    </div>


    <div id="earn" class="page">

        <h2>💰 Earn</h2>

        <p>
        Tap FOX coin and earn rewards
        </p>

    </div>


    <div id="missions" class="page">

        <h2>🎯 Missions</h2>

        <p>
        Invite friends and complete tasks
        </p>

    </div>


    <div id="rank" class="page">

        <h2>🏆 Rank</h2>

        <p>
        Your rank will appear here
        </p>

    </div>


    <div id="profile" class="page">

        <h2>👤 Profile</h2>

        <p>
        User profile coming soon
        </p>

    </div>


</div>


<script src="script.js"></script>

</body>
</html>
